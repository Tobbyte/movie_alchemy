{% extends "base.html" %}
{% block content %}
<header class="page-header welcome-header">
    <h1>Who's watching?</h1>
    <p class="intro">Pick a collection to open it, or add a new one.</p>
</header>

<section class="user-section" aria-labelledby="users-heading">
    <h2 id="users-heading" class="visually-hidden">Choose a collection</h2>
    {% if error %}
    <p class="error">{{ error }}</p>
    {% endif %}
<ul class="profile-list">
    {% for user in users %}
    <li>
            <a href="{{ url_for('users_movies', user_id=user.id) }}">
                <span class="avatar avatar-{{ loop.index0 % 5 }}" aria-hidden="true">{{ user.name[:1]|upper }}</span>
                <span class="profile-name">{{ user.name }}</span>
            </a>
            </li>
            {% endfor %}
            </ul>
<form class="search-form create-form" action="{{ url_for('users') }}" method="post">
    <label class="visually-hidden" for="name">Name</label>
    <input type="text" id="name" name="name" placeholder="New collection name" required>
    <button type="submit">Add collection</button>
</form>
</section>
{% endblock %}
